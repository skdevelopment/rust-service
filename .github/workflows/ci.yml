name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Vite build
        run: bun run build

  rust:
    name: Rust Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      # tauri::generate_context! requires frontendDist (../dist) to exist at compile time
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # The test suite regenerates the TypeScript bindings from the Rust
      # commands; fail if the committed copy is out of date.
      - name: Check TypeScript bindings are up to date
        shell: bash
        run: git diff --exit-code -- src/bindings.ts
