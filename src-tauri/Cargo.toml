[package]
name = "rustservice"
version = "0.1.0"
description = "Portable Windows desktop toolkit for computer repair technicians"
authors = ["Sonny Taylor"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustservice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Keep the tauri crate on the same minor as @tauri-apps/api in package.json,
# otherwise `tauri build` refuses to run (version mismatch check).
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", features = [
    "serde",
    "component",
    "user",
    "network",
] }
gfxinfo = "0.1"
battery = "0.7"
reqwest = { version = "0.13", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2"
log = "0.4"
base64 = "0.22"
regex = "1.12.2"
glob = "0.3"
dirs = "6"

# Agent conversation / command-history database
rusqlite = { version = "0.40", features = ["bundled"] }
urlencoding = "2"                                       # For URL encoding in search queries
zip = "2"                                               # Extract portable program archives
sha2 = "0.10"                                           # For SHA-256 checksums
hex = "0.4"                                             # For hex encoding

# MCP Server
hyper = { version = "1", features = ["server", "http1"] }  # HTTP types
hyper-util = { version = "0.1", features = ["tokio"] }  # HTTP server utilities  
http-body-util = "0.1"                                  # HTTP body utilities
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["serde_json", "chrono"] }
specta-typescript = "=0.0.12"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "shellapi",
    "winuser",
    "wingdi",
    "libloaderapi",
    "winbase",
    "winver",
    "stringapiset",
    "winnls",
] }
widestring = "1.0"

[dev-dependencies]
tempfile = "3"
